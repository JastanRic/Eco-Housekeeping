<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b4332">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Mahoora Housekeeping Checklist</title>
<style>
:root{--g:#1b4332;--g2:#2d6a4f;--bg:#edf1ec;--ink:#1d2822;--mut:#617068;--line:#d6ddd6;--red:#a63a30;--redbg:#fdeeeb;--okbg:#e2f2e8;--amber:#b7791f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.serif{font-family:Georgia,"Times New Roman",serif}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 0;box-shadow:0 2px 8px #0003}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:Georgia,serif;font-size:22px;letter-spacing:.14em;font-weight:700}
.sub{font-size:12px;opacity:.8}
.net{font-size:12px;display:flex;gap:6px;align-items:center;background:#ffffff1f;border-radius:99px;padding:4px 10px}
.dot{width:8px;height:8px;border-radius:50%;background:#58d68d}.dot.off{background:#f0a93b}
nav{display:flex;gap:6px;overflow-x:auto;padding:9px 0 8px;scrollbar-width:none}
nav a{flex:none;color:#fff;text-decoration:none;font-size:13px;border:1px solid #ffffff55;border-radius:99px;padding:4px 11px}
.bar{height:4px;background:#ffffff30;margin:0 -14px}.bar i{display:block;height:100%;width:0;background:#8fe3b0;transition:width .25s}
main{max-width:820px;margin:auto;padding:14px 12px 120px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px;scroll-margin-top:110px}
h2{font-family:Georgia,serif;font-size:19px;color:var(--g);margin:22px 2px 10px}
h2.first{margin-top:4px}
h3{font-size:16px;margin:0}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
label{display:block;font-size:13px;font-weight:600;color:#43524a;margin:0 0 4px}
input,textarea{width:100%;border:1px solid #c6d0c7;border-radius:9px;padding:11px 10px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:56px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,nav a:focus-visible{outline:3px solid #f0a93b;outline-offset:1px}
.item{display:grid;grid-template-columns:1fr auto;gap:7px 10px;align-items:center;padding:10px 0;border-top:1px solid #edf0ed}
.item:first-of-type{border-top:0}
.nm{font-size:15px;font-weight:500}
.ctl{display:flex;gap:6px}
.ctl button{width:46px;height:42px;border:1.5px solid #bfcac1;background:#fff;border-radius:8px;font-size:19px;font-weight:700;color:#7a877f;padding:0;cursor:pointer}
.ctl button[data-v=na]{font-size:12px;width:44px}
.ctl button[aria-pressed=true][data-v=ok]{background:var(--okbg);border-color:#2f8f5b;color:#17623a}
.ctl button[aria-pressed=true][data-v=issue]{background:var(--redbg);border-color:var(--red);color:var(--red)}
.ctl button[aria-pressed=true][data-v=na]{background:#e9edf0;border-color:#7d8a93;color:#46535b}
.cm{grid-column:1/-1;font-size:14px;padding:8px 10px}
.item[data-s=issue] .cm{border-color:var(--red);background:#fffaf9}
.hidden{display:none!important}
button.act{border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer}
.pri{background:var(--g);color:#fff}.sec{background:#e3ece5;color:var(--g)}
.allok{padding:6px 10px!important;font-size:13px!important}
.row{display:flex;gap:8px;flex-wrap:wrap}
.small{font-size:13px;color:var(--mut)}
.iss{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--red)}
.rec{border-top:1px solid var(--line);padding:9px 0;display:flex;justify-content:space-between;gap:8px;font-size:14px}.rec:first-child{border:0}
.tag{font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;height:fit-content;white-space:nowrap}
.tag.s{background:var(--okbg);color:#17623a}.tag.p{background:#fdf1d9;color:#8a5a0b}
footer{position:fixed;left:0;right:0;bottom:0;background:#fffffff0;backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:4}
footer div{max-width:820px;margin:auto;display:flex;gap:8px;align-items:center}
footer .cnt{font-size:13px;font-weight:600;color:var(--g);flex:none;min-width:70px}
footer button{flex:1}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d2822;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="top"><div><div class="brand">MAHOORA</div><div class="sub">Guest room housekeeping checklist</div></div>
  <div class="net"><span id="dot" class="dot off"></span><span id="net">Offline-ready</span></div></div>
  <nav id="nav" aria-label="Sections"></nav>
  <div class="bar"><i id="fill"></i></div>
</header>
<main>
  <h2 class="first">Tent inspection</h2>
  <section class="panel">
    <div class="grid">
      <div><label for="when">Date &amp; time</label><input id="when" type="datetime-local"></div>
      <div><label for="tent">Tent #</label><input id="tent" placeholder="e.g. B.16" autocomplete="off"></div>
      <div><label for="staff">Housekeeper / service staff</label><input id="staff" placeholder="Name(s)"></div>
      <div><label for="insp">Inspected by CM</label><input id="insp" placeholder="Inspector name"></div>
    </div>
  </section>
  <div id="list"></div>
  <h2>Finish</h2>
  <section class="panel">
    <label for="overall">Overall remarks</label>
    <textarea id="overall" placeholder="Anything that needs follow-up"></textarea>
    <div id="sum" class="small" style="margin-top:10px"></div>
    <ul id="iss" class="iss"></ul>
  </section>
  <h2>Saved on this phone</h2>
  <section class="panel">
    <div class="row" style="margin-bottom:6px"><button class="act sec" id="syncBtn">Send to Google Sheet</button><button class="act sec" id="csvBtn">Download CSV</button></div>
    <p class="small" style="margin:6px 0">Inspections save here first, even with no signal, and send to the Google Sheet automatically when the phone is online.</p>
    <div id="recs"></div>
  </section>
</main>
<footer><div><span class="cnt" id="cnt">0/0</span><button class="act sec" id="clearBtn">Clear</button><button class="act pri" id="saveBtn">Save inspection</button></div></footer>
<div id="toast" role="status"></div>
<script>
const CONFIG={
  SCRIPT_URL:"PASTE_GOOGLE_WEB_APP_URL_HERE", /* from Apps Script > Deploy > Web app */
  KEY:"change-this-secret"                    /* must match SECRET in Code.gs */
};
const SECTIONS=[
{part:"Tent / accommodation checklist",name:"Living Area",items:["Door lock / No gaps","Power supply light and switches","Fan","Room is clean - walls / floor and other items","All items are in the right place","Curtains"]},
{part:"Tent / accommodation checklist",name:"Bedroom",items:["Beds made","Other items in the right place","Linen clean and neat"]},
{part:"Tent / accommodation checklist",name:"Washroom",items:["Clean and dust free","Shower area","No leaks / no water"]},
{part:"Tent / accommodation checklist",name:"General",items:["Safety booklet in place","ECO cream hung","All carpets in place","Bino / Raincoats / umbrellas"]},
{part:"Tent / accommodation checklist",name:"Outside",items:["Chairs, table rack / carpets / other","Floor sheet is clean","Fly sheets are good"]},
{part:"Item check list: bedroom and living room",name:"Bedroom & living room items",items:["Side table / table cloth","Floor cushions (1)","Pillows (4)","Oil canter / oil lamp","Bed throw cushions (2)","Bed sheets / cover","Bell","Bed runner","Furniture (chair, luggage rack)","Water bottles (2)","Light bulbs","Floor mats (2 for living and bed room)","Glasses and glass covers","Raincoats (2)","Bino","Safety booklet","Umbrellas","Eco cream wall hanger"]},
{part:"Bathroom checklist",name:"Bathroom items",items:["Carpets (03): commode, outside the shower and near the sink","All amenities","Towels","Hangers","Soap","Toilet roll"]}
];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEYS=[];SECTIONS.forEach(s=>s.items.forEach(i=>KEYS.push(s.name+" | "+i)));
let S={},PAINT={},db,syncing=false;
const SYM={ok:"✓",issue:"✗",na:"N/A"};

/* ---------- storage (IndexedDB) ---------- */
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open("mahoora-housekeeping-db",1);r.onupgradeneeded=()=>r.result.createObjectStore("inspections",{keyPath:"id"});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)});
const store=m=>db.transaction("inspections",m).objectStore("inspections");
const all=()=>new Promise((res,rej)=>{const r=store("readonly").getAll();r.onsuccess=()=>res(r.result.sort((a,b)=>b.createdAt.localeCompare(a.createdAt)));r.onerror=()=>rej(r.error)});
const put=v=>new Promise((res,rej)=>{const r=store("readwrite").put(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});

/* ---------- UI ---------- */
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),3200)}
function nowLocal(){const d=new Date(),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function render(){
  const root=$("list"),nav=$("nav");root.innerHTML="";nav.innerHTML="";PAINT={};let last="";
  SECTIONS.forEach((sec,si)=>{
    if(sec.part!==last&&si>0){root.insertAdjacentHTML("beforeend",`<h2>${esc(sec.part)}</h2>`)}
    last=sec.part;
    nav.insertAdjacentHTML("beforeend",`<a href="#s${si}">${esc(sec.name)}</a>`);
    const p=document.createElement("section");p.className="panel";p.id="s"+si;
    p.innerHTML=`<div class="sh"><h3>${esc(sec.name)}</h3><button type="button" class="act sec allok">All ✓</button></div>`;
    sec.items.forEach(it=>{
      const k=sec.name+" | "+it,st=S[k]||(S[k]={s:"",c:""});
      const row=document.createElement("div");row.className="item";
      row.innerHTML=`<div class="nm">${esc(it)}</div><div class="ctl" role="group" aria-label="${esc(it)}"><button type="button" data-v="ok" aria-label="OK">✓</button><button type="button" data-v="issue" aria-label="Issue">✗</button><button type="button" data-v="na" aria-label="Not applicable">N/A</button></div><input class="cm" placeholder="Comment" aria-label="Comment for ${esc(it)}">`;
      const b=[...row.querySelectorAll("button")],cm=row.querySelector(".cm");
      PAINT[k]=()=>{b.forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.v===st.s)));row.dataset.s=st.s;cm.classList.toggle("hidden",!st.s);cm.value=st.c};
      b.forEach(x=>x.onclick=()=>{st.s=st.s===x.dataset.v?"":x.dataset.v;PAINT[k]();summary();if(st.s==="issue")cm.focus()});
      cm.oninput=()=>st.c=cm.value;
      PAINT[k]();p.appendChild(row);
    });
    p.querySelector(".allok").onclick=()=>{sec.items.forEach(it=>{const k=sec.name+" | "+it;if(!S[k].s){S[k].s="ok";PAINT[k]()}});summary()};
    root.appendChild(p);
  });
}
function summary(){
  let ok=0,bad=0,na=0;const issues=[];
  KEYS.forEach(k=>{const v=S[k];if(v.s==="ok")ok++;else if(v.s==="issue"){bad++;issues.push(k.replace(" | ",": "))}else if(v.s==="na")na++});
  const done=ok+bad+na,n=KEYS.length;
  $("cnt").textContent=done+"/"+n;$("fill").style.width=(done/n*100)+"%";
  $("sum").textContent=`Marked ${done} of ${n} · ✓ ${ok} · ✗ ${bad} · N/A ${na}`;
  $("iss").innerHTML=issues.map(i=>`<li>${esc(i)}</li>`).join("");
}
function reset(){["tent","staff","insp","overall"].forEach(i=>$(i).value="");$("when").value=nowLocal();S={};render();summary();scrollTo(0,0)}
function build(){
  const tent=$("tent").value.trim();
  if(!tent){toast("Enter the tent number first.");$("tent").focus();return null}
  const miss=KEYS.filter(k=>!S[k].s).length;
  if(miss&&!confirm(miss+" items are not marked. Save anyway?"))return null;
  const checks={};KEYS.forEach(k=>checks[k]={status:S[k].s,comment:S[k].c.trim()});
  return{id:crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2),createdAt:new Date().toISOString(),inspectionDate:$("when").value,tent,staff:$("staff").value.trim(),inspector:$("insp").value.trim(),overall:$("overall").value.trim(),checks,syncStatus:"pending"};
}
async function save(){const r=build();if(!r)return;await put(r);toast("Saved on this phone.");reset();await recs();sync(false)}
async function recs(){
  const a=await all(),el=$("recs");
  if(!a.length){el.innerHTML='<span class="small">No inspections saved yet.</span>';return}
  el.innerHTML=a.slice(0,30).map(r=>{const c=Object.values(r.checks),bad=c.filter(x=>x.status==="issue").length;
    return`<div class="rec"><div><strong>Tent ${esc(r.tent)}</strong><div class="small">${esc((r.inspectionDate||"").replace("T"," "))} · ${esc(r.staff||"no staff name")} · ${bad} issue${bad===1?"":"s"}</div></div><span class="tag ${r.syncStatus==="synced"?"s":"p"}">${r.syncStatus==="synced"?"Sent":"Waiting"}</span></div>`}).join("");
}

/* ---------- send to Google Sheet ---------- */
async function sync(manual){
  if(CONFIG.SCRIPT_URL.startsWith("PASTE")){if(manual)toast("Google Sheet link is not set up yet.");return}
  if(!navigator.onLine){if(manual)toast("No internet. Saved records will send later.");return}
  if(syncing)return;syncing=true;
  const pend=(await all()).filter(r=>r.syncStatus!=="synced");let n=0;
  for(const r of pend){
    try{
      const resp=await fetch(CONFIG.SCRIPT_URL,{method:"POST",body:JSON.stringify({key:CONFIG.KEY,items:KEYS,...r})});
      const j=await resp.json();if(!j.ok)throw new Error(j.error||"rejected");
      r.syncStatus="synced";r.syncedAt=new Date().toISOString();await put(r);n++;
    }catch(e){console.warn(e);break}
  }
  syncing=false;await recs();
  if(manual)toast(!pend.length?"Everything is already sent.":n===pend.length?n+" sent to Google Sheet.":(pend.length-n)+" could not be sent. Try again.");
}
async function csv(){
  const a=await all();if(!a.length){toast("Nothing to download yet.");return}
  const rows=[["ID","Date/time","Tent","Staff","Inspected by","Section","Item","Status","Comment","Overall remarks"]];
  a.forEach(r=>Object.entries(r.checks).forEach(([k,v])=>{const[s,i]=k.split(" | ");rows.push([r.id,r.inspectionDate,r.tent,r.staff,r.inspector,s,i,v.status||"unmarked",v.comment,r.overall])}));
  const t=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
  const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([t],{type:"text/csv;charset=utf-8"}));l.download="mahoora-housekeeping.csv";l.click();
}
function net(){const o=navigator.onLine;$("dot").className="dot"+(o?"":" off");$("net").textContent=o?"Online":"Offline: saving here"}

$("saveBtn").onclick=save;$("syncBtn").onclick=()=>sync(true);$("csvBtn").onclick=csv;
$("clearBtn").onclick=()=>{if(confirm("Clear this inspection form?"))reset()};
addEventListener("online",()=>{net();sync(false)});addEventListener("offline",net);
(async()=>{await open();$("when").value=nowLocal();render();summary();net();await recs();sync(false);
  if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(console.warn)})();
</script>
</body>
</html>
