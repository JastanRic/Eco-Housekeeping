<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b4332">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<title>Mahoora Housekeeping: Start</title>
</head>
<body>
<header>
  <div class="top"><div><div class="brand">MAHOORA</div><div class="sub">Guest room housekeeping checklist</div></div>
  <div class="net"><span id="dot" class="dot off"></span><span id="net">Offline-ready</span></div></div>
</header>
<main>
  <h1>Start an inspection</h1>
  <p class="small" style="margin:0 2px 12px">Fill in these details, then tick each section on the next page.</p>
  <form class="panel" id="f" autocomplete="off">
    <div class="grid">
      <div><label for="when">Date &amp; time</label><input id="when" type="datetime-local" required></div>
      <div><label for="tent">Tent #</label><input id="tent" placeholder="e.g. B.16" required></div>
      <div><label for="staff">Housekeeper / service staff</label><input id="staff" placeholder="Name(s)" required></div>
      <div><label for="insp">Inspected by CM</label><input id="insp" placeholder="Inspector name" required></div>
    </div>
    <button class="act pri big" type="submit" style="margin-top:14px">Start inspection</button>
  </form>
  <h2>Saved on this phone</h2>
  <section class="panel">
    <div class="row" style="margin-bottom:6px"><button class="act sec" id="syncBtn" type="button">Send waiting ones now</button><button class="act sec" id="csvBtn" type="button">Download CSV</button></div>
    <p class="small" style="margin:6px 0">Finished inspections are kept here and sent to the Google Sheet and Drive when the phone is online.</p>
    <div id="recs"></div>
  </section>
</main>
<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
<script>
async function recs(){
  const a=await all(),el=$("recs");
  if(!a.length){el.innerHTML='<span class="small">No inspections yet.</span>';return}
  el.innerHTML=a.slice(0,30).map(r=>{const bad=Object.values(r.checks).filter(x=>x.status==="issue").length,ok=r.syncStatus==="synced";
    return`<div class="rec"><div><strong>Tent ${esc(r.tent)}</strong><div class="small">${esc((r.inspectionDate||"").replace("T"," "))} · ${esc(r.staff||"no staff name")} · ${bad} issue${bad===1?"":"s"}</div></div><span class="tag ${ok?"s":"p"}">${ok?"Sent":"Waiting"}</span></div>`}).join("");
}
window.onSynced=recs;
$("f").onsubmit=e=>{
  e.preventDefault();
  const s={inspectionDate:$("when").value,tent:$("tent").value.trim(),staff:$("staff").value.trim(),inspector:$("insp").value.trim()};
  localStorage.setItem("mhk_session",JSON.stringify(s));
  localStorage.setItem("mhk_last",JSON.stringify({staff:s.staff,inspector:s.inspector}));
  localStorage.removeItem("mhk_draft");
  location.href="inspection.html";
};
$("syncBtn").onclick=async()=>{await sync(true);recs()};$("csvBtn").onclick=csv;
(async()=>{
  await openDB();$("when").value=nowLocal();
  try{const l=JSON.parse(localStorage.getItem("mhk_last"));if(l){$("staff").value=l.staff||"";$("insp").value=l.inspector||""}}catch{}
  net();await recs();sync(false).then(recs);registerSW();
})();
</script>
</body>
</html>
